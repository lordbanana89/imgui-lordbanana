name: build-natives

# Builds imgui-lordbanana native binaries for 5 classifiers via SpaiR's proven
# build.sh orchestration (vendor static FreeType -> generateLibs -> macOS lipo),
# then assembles the binding + multiplatform natives jar. Cannot run in a dev
# sandbox (per-OS toolchains). Output layout matches
# imgui.lordbanana.ImGui#nativeClassifierDir(): com/lordbanana/imgui-natives/<classifier>/<lib>
# classifiers: windows-x86_64 | linux-x86_64 | linux-arm64 | macos (universal)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, type: windows, runs-on: ubuntu-latest,    libfile: imgui-lordbanana-java64.dll }
          - { name: linux-x86_64,   type: linux,   runs-on: ubuntu-latest,    libfile: libimgui-lordbanana-java64.so }
          - { name: linux-arm64,    type: linux,   runs-on: ubuntu-24.04-arm, libfile: libimgui-lordbanana-java64.so }
          - { name: macos,          type: macos,   runs-on: macos-14,         libfile: libimgui-lordbanana-java64.dylib }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # include/imgui (1.90.9 docking) + implot/imnodes/imguizmo/node-editor/knobs/club/texteditor/filedialog
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: 17
      - name: Install Windows cross toolchain (mingw)
        if: matrix.type == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build native (vendor static FreeType -> generateLibs -> [macOS lipo])
        run: |
          chmod +x ./gradlew buildSrc/scripts/build.sh buildSrc/scripts/vendor_freetype.sh
          bash buildSrc/scripts/build.sh ${{ matrix.type }}
      - name: Verify built native exists + carries lordbanana JNI symbols
        run: |
          test -f "/tmp/imgui/dst/${{ matrix.libfile }}" || { echo "MISSING native /tmp/imgui/dst/${{ matrix.libfile }}"; exit 1; }
          ls -la "/tmp/imgui/dst/${{ matrix.libfile }}"
          # symbol sanity (nm on linux/mac; objdump for the .dll) — must export Java_imgui_lordbanana_*, zero bare Java_imgui_
          if command -v nm >/dev/null && [[ "${{ matrix.libfile }}" != *.dll ]]; then
            LB=$(nm -gU "/tmp/imgui/dst/${{ matrix.libfile }}" 2>/dev/null | grep -c "Java_imgui_lordbanana_" || true)
            BARE=$(nm -gU "/tmp/imgui/dst/${{ matrix.libfile }}" 2>/dev/null | grep "Java_imgui_" | grep -vc "lordbanana" || true)
            echo "lordbanana JNI symbols: $LB ; bare Java_imgui_ (must be 0): $BARE"
          fi
      - name: Stage native into classifier folder
        run: |
          DEST="natives/com/lordbanana/imgui-natives/${{ matrix.name }}"
          mkdir -p "$DEST"
          cp "/tmp/imgui/dst/${{ matrix.libfile }}" "$DEST/"
          ls -la "$DEST"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: natives/

  assemble:
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: liberica, java-version: 17 }
      - name: Build the binding jar (imgui.lordbanana classes)
        run: |
          chmod +x ./gradlew
          ./gradlew :imgui-binding:jar --no-daemon
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Assemble multiplatform natives jar
        run: |
          mkdir -p natives-merged
          for d in dl/native-*/; do cp -R "$d"/. natives-merged/; done
          echo "=== natives jar contents ==="
          find natives-merged -type f
          (cd natives-merged && jar cf ../imgui-lordbanana-natives.jar .)
          echo "=== jar listing ==="
          jar tf imgui-lordbanana-natives.jar
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-lordbanana-jars
          path: |
            imgui-lordbanana-natives.jar
            imgui-binding/build/libs/*.jar
